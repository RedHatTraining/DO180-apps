apiVersion: v1
kind: Secret
metadata:
  name: awx-tls-secret
  namespace: awx
type: kubernetes.io/tls
data:
  # Replace with your base64-encoded TLS certificate and key
  # Generate with: cat tls.crt | base64 -w0
  # Generate with: cat tls.key | base64 -w0
  tls.crt: REPLACE_WITH_BASE64_ENCODED_CERT
  tls.key: REPLACE_WITH_BASE64_ENCODED_KEY
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: awx-network-policy
  namespace: awx
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: awx-production
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8052
  egress:
    - to: []
