apiVersion: batch/v1
kind: CronJob
metadata:
  name: awx-postgres-backup
  namespace: awx
spec:
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: postgres-backup
              image: postgres:15
              env:
                - name: PGHOST
                  value: awx-production-postgres-15
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: awx-production-postgres-configuration
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: awx-production-postgres-configuration
                      key: password
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: awx-production-postgres-configuration
                      key: database
              command:
                - /bin/bash
                - -c
                - |
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  pg_dump -Fc > /backups/awx_backup_${TIMESTAMP}.dump
                  # Keep only last 7 days of backups
                  find /backups -name "awx_backup_*.dump" -mtime +7 -delete
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: awx-backup-pvc
          restartPolicy: OnFailure
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: awx-backup-pvc
  namespace: awx
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard
